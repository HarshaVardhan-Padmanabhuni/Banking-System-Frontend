spring:
  application:
    name: authservice

  datasource:
    url: jdbc:mysql://localhost:3307/Bankingsystem
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect

  cloud:
    inetutils:
      preferred-networks:
        - 127

      ignored-interfaces:
        - eth.*
        - docker.*
        - veth.*
        - br.*

  mail:
    host: smtp.gmail.com
    port: 587
    username: harshithareddy035@gmail.com
    password: jjogbiuckesvopjq
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000


jwt:
  secret: MySuperSecureJWTSecretKeyThatIsAtLeast32Chars
  expiration-ms: 3600000

otp:
  length: 4
  expiry-seconds: 300

server:
  port: 8903
  ssl:
    key-store: src/main/resources/keystore.p12
    key-store-password: password
    key-store-type: PKCS12
    key-alias: bankingapp


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    non-secure-port-enabled: false
    secure-port-enabled: true
    prefer-ip-address: false
    hostname: localhost
    ip-address: 127.0.0.1
    secure-port: 8903
    instance-id: ${spring.application.name}:${server.port}

webauthn:
  rpId: "localhost"
  rpName: "Banking App"
  origin: "http://localhost:5173"   # frontend origin
  timeoutMs: 60000
  challengeTtlSeconds: 300

logging:
  level:
    root: DEBUG